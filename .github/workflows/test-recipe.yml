name: Test Recipe Build

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe to build (e.g. x64-glibc-217)'
        required: true
        default: 'x64-glibc-217'
      node_version:
        description: 'Node.js version to build (e.g. v24.20.0)'
        required: true
        default: 'v24.20.0'
  # The "Run workflow" branch picker only offers refs that GitHub has already
  # indexed for this workflow, so a recently created branch can be missing from
  # it even though dispatching that ref via the API works fine. Keep a push
  # trigger on the working branch so it can always build without the UI.
  push:
    branches:
      - copilot/verify-glibc-requirements

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The `inputs` context is null for push events, so fall back to the same
    # values the dispatch form defaults to.
    env:
      RECIPE: ${{ inputs.recipe || 'x64-glibc-217' }}
      NODE_VERSION: ${{ inputs.node_version || 'v24.20.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build recipe
        run: |
          ./bin/local_build.sh -r "$RECIPE" -v "$NODE_VERSION"
          echo "STAGING_DIR=$(realpath "$GITHUB_WORKSPACE/../staging")" >> "$GITHUB_ENV"

      - name: List build artifacts
        run: |
          find "$STAGING_DIR" -name 'node-*' -type f 2>/dev/null || echo "No artifacts found"
          ls -lh "$STAGING_DIR/release/$NODE_VERSION/" 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ env.NODE_VERSION }}-${{ env.RECIPE }}
          path: ${{ env.STAGING_DIR }}/release/${{ env.NODE_VERSION }}/node-*.tar.*
          if-no-files-found: warn
